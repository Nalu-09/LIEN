<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIEN｜導入のご相談・お申込み</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2a2a2a;--sub:#6a6a6a;--line:#dcd6c8;--gold:#b8860b;--gold-dim:#c6a15b;--ivory:#faf8f2;--navy:#1c2a3a}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--ivory);color:var(--ink);font-family:"Noto Serif JP",serif;line-height:1.8;padding:0 18px 60px}
  .wrap{max-width:600px;margin:0 auto}
  header{text-align:center;padding:40px 0 24px}
  header .logo{font-family:"Shippori Mincho",serif;font-weight:700;font-size:1.6rem;letter-spacing:.14em;color:var(--navy)}
  header .sub{font-size:.72rem;letter-spacing:.2em;color:var(--sub);margin-top:6px}
  h1{font-family:"Shippori Mincho",serif;font-weight:600;font-size:1.15rem;text-align:center;margin:8px 0 20px;color:var(--navy)}
  .lead{font-size:.86rem;color:var(--sub);text-align:center;margin-bottom:28px;line-height:1.9}
  .field{margin-bottom:22px}
  .field label{display:block;font-size:.84rem;font-weight:600;margin-bottom:7px;color:var(--ink)}
  .field .req{color:var(--gold);font-size:.72rem;margin-left:6px}
  .field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:inherit;font-size:.92rem;color:var(--ink)}
  .field textarea{min-height:90px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-dim)}
  .radio-group{display:flex;flex-direction:column;gap:10px}
  .radio-opt{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;cursor:pointer}
  .radio-opt input{width:auto;margin-top:4px}
  .radio-opt .t{font-size:.9rem;font-weight:600}
  .radio-opt .d{font-size:.76rem;color:var(--sub)}
  .note{background:#f3efe4;border:1px solid var(--line);border-radius:8px;padding:14px;font-size:.78rem;color:var(--sub);line-height:1.85;margin-bottom:22px}
  .agree{display:flex;align-items:flex-start;gap:9px;font-size:.82rem;margin-bottom:24px}
  .agree input{width:auto;margin-top:5px}
  .agree a{color:var(--gold);text-decoration:underline}
  .submit{width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:16px;font-family:"Shippori Mincho",serif;font-weight:600;font-size:1rem;letter-spacing:.08em;cursor:pointer}
  .submit:disabled{opacity:.5;cursor:default}
  .result{display:none;text-align:center;padding:30px 0}
  .result h2{font-family:"Shippori Mincho",serif;font-size:1.15rem;color:var(--navy);margin-bottom:14px}
  .result p{font-size:.88rem;color:var(--sub);line-height:1.9;margin-bottom:20px}
  .result .paybtn{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;border-radius:10px;padding:15px 30px;font-family:"Shippori Mincho",serif;font-weight:600;font-size:.95rem}
  .plan-only{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">LIEN</div>
    <div class="sub">BY NALU-09</div>
  </header>

  <div id="formArea">
    <h1>導入のご相談・お申込み</h1>
    <p class="lead">
      「まず相談したい」方も、「申込みたい」方も、こちらからお進みください。<br>
      ご相談は内容を確認のうえ、追ってご連絡いたします。
    </p>

    <div class="field">
      <label>ご希望<span class="req">必須</span></label>
      <div class="radio-group">
        <label class="radio-opt">
          <input type="radio" name="type" value="相談" onchange="onType()">
          <span><span class="t">まず相談したい</span><br><span class="d">自分の運営に合うか等を相談する</span></span>
        </label>
        <label class="radio-opt">
          <input type="radio" name="type" value="申込" onchange="onType()">
          <span><span class="t">申込みたい</span><br><span class="d">プランを決めて購入に進む</span></span>
        </label>
      </div>
    </div>

    <div class="field"><label>お名前<span class="req">必須</span></label><input id="name" type="text"></div>
    <div class="field"><label>お名前（カナ）<span class="req">必須</span></label><input id="kana" type="text"></div>
    <div class="field"><label>メールアドレス<span class="req">必須</span></label><input id="email" type="email"></div>
    <div class="field"><label>電話番号<span class="req">必須</span></label><input id="tel" type="tel"></div>
    <div class="field"><label>事業者名・屋号</label><input id="company" type="text"></div>
    <div class="field"><label>業種</label><input id="industry" type="text" placeholder="例：会員制の食事会／サロン／教室 など"></div>

    <div class="field">
      <label>ご希望・ご検討中のプラン<span class="req">必須</span></label>
      <select id="plan">
        <option value="">選択してください</option>
        <option value="Basic Plan">ベーシック（初期198,000円＋月額22,000円）</option>
        <option value="Standard Plan">スタンダード（初期298,000円＋月額22,000円）</option>
        <option value="Premium">プレミアム（要相談・カスタム）</option>
        <option value="未定">まだ決めていない／相談したい</option>
      </select>
    </div>

    <div class="field"><label>運営の概要・ご相談内容</label><textarea id="detail" placeholder="現在の会員数・開催頻度・いまの管理方法・お困りごと など"></textarea></div>
    <div class="field"><label>ご希望時期</label><input id="timing" type="text" placeholder="例：来月中に導入したい など"></div>

    <div class="note plan-only" id="applyNote">
      ※お申込みの場合、送信後に初期費用のお支払い（クレジットカード）にお進みいただけます。<br>
      ※月額費用（22,000円）は、納品の翌月末より開始します。別途ご案内するリンクからご登録ください。<br>
      ※プレミアム（カスタム）は個別お見積りのため決済には進まず、内容を確認してご連絡します。
    </div>

    <label class="agree">
      <input type="checkbox" id="agree">
      <span><a href="#" target="_blank">利用規約</a>・<a href="https://sudden-squid-b26.notion.site/Nalu-09-3992665c0f6b803baddfc14da896d526?source=copy_link" target="_blank">プライバシーポリシー</a>に同意します（必須）</span>
    </label>

    <button class="submit" id="submitBtn" onclick="SUBMIT()">送信する</button>
  </div>

  <div class="result" id="result">
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <a class="paybtn" id="payBtn" href="#" style="display:none" target="_blank">お支払いに進む</a>
  </div>
</div>

<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbwUgSH9JYdM57PjT5Zm-XkXcsXCKiNA6nCQi845fqJy2xByjWFk7eaGwKL_iPi7vtCH/exec"; // ← このフォーム用GASのウェブアプリURL（…/exec）

function onType(){
  var t = document.querySelector('input[name="type"]:checked');
  document.getElementById('applyNote').style.display = (t && t.value==='申込') ? 'block' : 'none';
}

function SUBMIT(){
  var btn = document.getElementById('submitBtn');
  var typeEl = document.querySelector('input[name="type"]:checked');
  if(!typeEl){ alert('「ご希望」を選択してください'); return; }
  var type = typeEl.value;
  var name = document.getElementById('name').value.trim();
  var kana = document.getElementById('kana').value.trim();
  var email = document.getElementById('email').value.trim();
  var tel = document.getElementById('tel').value.trim();
  var plan = document.getElementById('plan').value;
  var agree = document.getElementById('agree').checked;

  if(!name||!kana||!email||!tel){ alert('必須項目（お名前・カナ・メール・電話）をご入力ください'); return; }
  if(!plan){ alert('プランを選択してください'); return; }
  if(!agree){ alert('利用規約・プライバシーポリシーへの同意が必要です'); return; }

  btn.disabled = true; btn.textContent = '送信中…';

  var payload = {
    type: type, name: name, kana: kana, email: email, tel: tel,
    company: document.getElementById('company').value.trim(),
    industry: document.getElementById('industry').value.trim(),
    plan: plan,
    detail: document.getElementById('detail').value.trim(),
    timing: document.getElementById('timing').value.trim()
  };

  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) })
  .then(function(r){ return r.json(); })
  .then(function(d){
    document.getElementById('formArea').style.display = 'none';
    var res = document.getElementById('result');
    res.style.display = 'block';
    if(type === '申込' && d.url){
      document.getElementById('resultTitle').textContent = 'お申込みありがとうございます';
      document.getElementById('resultMsg').textContent = '続けて、初期費用のお支払いにお進みください。';
      var pay = document.getElementById('payBtn');
      pay.href = d.url; pay.style.display = 'inline-block';
    } else if(type === '申込' && !d.url){
      // プレミアム等、URLがない申込
      document.getElementById('resultTitle').textContent = 'お申込みを受け付けました';
      document.getElementById('resultMsg').textContent = 'カスタム内容のため、内容を確認のうえ、担当より個別にご連絡いたします。';
    } else {
      document.getElementById('resultTitle').textContent = 'ご相談を受け付けました';
      document.getElementById('resultMsg').textContent = '内容を確認し、追ってご連絡いたします。ありがとうございました。';
    }
  })
  .catch(function(e){
    btn.disabled = false; btn.textContent = '送信する';
    alert('送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。\n' + e.message);
  });
}
</script>
</body>
</html>
